[project]
name = "homomorphicconvolutionsupervised"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "hydra-core>=1.3.8",
    "mlflow>=3.18.0",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "pyiqa>=0.1.14.1",
    "torch==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.9",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
